name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check-typescript:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: demo
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - run: npm ci

      - run: npx tsc --noEmit

      - name: Run vitest (nodeAnimator FIFO contract)
        run: npm test
